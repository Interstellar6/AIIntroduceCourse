<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="1240" height="1010"
     font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d6bfe"/>
    </marker>
    <linearGradient id="gm2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b78ff"/>
      <stop offset="100%" stop-color="#3f57d8"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="1010" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#1b2033">Agent 和 Harness：一个是机制，一个是产品</text>
  <text x="40" y="82" font-size="15.5" fill="#6b7490">同一个模型装在不同软件里能力差很多 —— 差别不在模型，在 Harness。但 Harness 和 Agent 不是一回事。</text>

  <!-- ============ 第一排：三个词各回答什么问题 ============ -->
  <text x="40" y="98" font-size="14" font-weight="700" fill="#3f57d8">先分清这三个词</text>

  <!-- 卡 1 模型 -->
  <rect x="40" y="110" width="373" height="202" rx="14" fill="#f7f9ff" stroke="#dbe3fb" stroke-width="1.5"/>
  <text x="62" y="146" font-size="20" font-weight="700" fill="#1b2033">模型</text>
  <text x="118" y="146" font-size="13.5" fill="#8590ad">能力来源 · 买来的</text>
  <line x1="62" y1="160" x2="391" y2="160" stroke="#e2e8f7"/>
  <text x="62" y="186" font-size="13.5" fill="#40496a">文字进 → 文字出</text>
  <text x="62" y="210" font-size="13.5" fill="#40496a">没有记忆</text>
  <text x="62" y="234" font-size="13.5" fill="#40496a">没有手</text>
  <text x="62" y="258" font-size="13.5" fill="#40496a">一次调用就结束</text>
  <rect x="62" y="272" width="329" height="28" rx="7" fill="#ffffff" stroke="#dbe3fb"/>
  <text x="76" y="291" font-size="12.5" fill="#3f57d8" font-weight="700">你只能选，不能改</text>

  <!-- 卡 2 Agent -->
  <rect x="433" y="110" width="373" height="202" rx="14" fill="#f6fbf8" stroke="#bfe3d2" stroke-width="1.5"/>
  <text x="455" y="146" font-size="20" font-weight="700" fill="#1b2033">Agent</text>
  <text x="523" y="146" font-size="13.5" fill="#1f8a5f" font-weight="700">一套机制</text>
  <line x1="455" y1="160" x2="784" y2="160" stroke="#d6ece1"/>
  <text x="455" y="186" font-size="13.5" fill="#40496a">模型 + 循环 + 工具 + 持久日志</text>
  <text x="455" y="210" font-size="13.5" fill="#40496a">循环：说完不算完，真去执行再回来</text>
  <text x="455" y="234" font-size="13.5" fill="#40496a">工具：模型只说用哪个，执行的是程序</text>
  <rect x="455" y="272" width="329" height="28" rx="7" fill="#ffffff" stroke="#bfe3d2"/>
  <text x="469" y="291" font-size="12.5" fill="#1f8a5f" font-weight="700">回答「能不能动手」→ 是个开关：有 / 没有</text>

  <!-- 卡 3 Harness -->
  <rect x="826" y="110" width="373" height="202" rx="14" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.8"/>
  <text x="848" y="146" font-size="20" font-weight="700" fill="#1b2033">Harness</text>
  <text x="940" y="146" font-size="13.5" fill="#a5670f" font-weight="700">一个产品</text>
  <line x1="848" y1="160" x2="1177" y2="160" stroke="#f4dcb6"/>
  <text x="848" y="186" font-size="13.5" fill="#40496a">把上面那套机制做成能装的软件</text>
  <text x="848" y="210" font-size="13.5" fill="#40496a">它还包含机制之外的一整套工程：</text>
  <text x="848" y="234" font-size="13.5" fill="#40496a">适配 · 上下文 · 权限 · 界面 · 插件</text>
  <rect x="848" y="272" width="329" height="28" rx="7" fill="#ffffff" stroke="#f0c07a"/>
  <text x="862" y="291" font-size="12.5" fill="#a5670f" font-weight="700">回答「动手动得多好、会不会闯祸」→ 是个刻度</text>

  <!-- ============ 第二排：嵌套关系 ============ -->
  <text x="40" y="344" font-size="14" font-weight="700" fill="#3f57d8">它们的关系：Harness 把 Agent 机制包在里面</text>

  <rect x="40" y="358" width="1160" height="392" rx="20" fill="#fffaf0" stroke="#f0c07a" stroke-width="2"/>
  <text x="62" y="390" font-size="16" font-weight="700" fill="#a5670f">Harness</text>
  <text x="140" y="390" font-size="13.5" fill="#8a5a12">—— 你在电脑上装的那个软件。下面这六样，是「机制」之外它额外要管的事：</text>

  <!-- 六枚能力标签 -->
  <g font-size="12.5" font-weight="700">
    <rect x="62"  y="404" width="150" height="32" rx="16" fill="#ffffff" stroke="#f0c07a"/>
    <text x="137" y="425" fill="#a5670f" text-anchor="middle">模型适配</text>
    <rect x="224" y="404" width="150" height="32" rx="16" fill="#ffffff" stroke="#f0c07a"/>
    <text x="299" y="425" fill="#a5670f" text-anchor="middle">上下文管理</text>
    <rect x="386" y="404" width="150" height="32" rx="16" fill="#ffffff" stroke="#f0c07a"/>
    <text x="461" y="425" fill="#a5670f" text-anchor="middle">沙箱与权限</text>
    <rect x="548" y="404" width="150" height="32" rx="16" fill="#ffffff" stroke="#f0c07a"/>
    <text x="623" y="425" fill="#a5670f" text-anchor="middle">界面</text>
    <rect x="710" y="404" width="150" height="32" rx="16" fill="#ffffff" stroke="#f0c07a"/>
    <text x="785" y="425" fill="#a5670f" text-anchor="middle">配置与插件</text>
    <rect x="872" y="404" width="150" height="32" rx="16" fill="#ffffff" stroke="#f0c07a"/>
    <text x="947" y="425" fill="#a5670f" text-anchor="middle">模式预设</text>
  </g>
  <text x="1038" y="425" font-size="12.5" fill="#b08a4a">← 这六样才是关键差别</text>

  <!-- Agent 机制内框 -->
  <rect x="80" y="452" width="1080" height="272" rx="16" fill="#f6fbf8" stroke="#1f8a5f" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="102" y="482" font-size="16" font-weight="700" fill="#1f8a5f">Agent 机制</text>
  <text x="200" y="482" font-size="13.5" fill="#3d6b58">—— Harness 的内核。上一页那五步循环就住在这里：</text>

  <!-- 五步循环 -->
  <g font-size="13">
    <rect x="106" y="500" width="176" height="80" rx="10" fill="#ffffff" stroke="#bfe3d2" stroke-width="1.5"/>
    <text x="194" y="526" font-size="13.5" font-weight="700" fill="#1b2033" text-anchor="middle">① 组装上下文</text>
    <text x="194" y="550" fill="#8590ad" text-anchor="middle">提示词 · 工具表</text>
    <text x="194" y="568" fill="#8590ad" text-anchor="middle">历史 · 工具输出</text>

    <rect x="314" y="500" width="176" height="80" rx="10" fill="url(#gm2)"/>
    <text x="402" y="526" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">②③ 模型</text>
    <text x="402" y="550" fill="#dfe5ff" text-anchor="middle">文字进 → 文字出</text>
    <text x="402" y="568" fill="#dfe5ff" text-anchor="middle">决定要不要用工具</text>

    <rect x="522" y="500" width="176" height="80" rx="10" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.5"/>
    <text x="610" y="526" font-size="13.5" font-weight="700" fill="#a5670f" text-anchor="middle">闸门</text>
    <text x="610" y="550" fill="#8a5a12" text-anchor="middle">审批 · 沙箱</text>
    <text x="610" y="568" fill="#8a5a12" text-anchor="middle">拦在前面而不是事后</text>

    <rect x="730" y="500" width="176" height="80" rx="10" fill="#ffffff" stroke="#bfe3d2" stroke-width="1.5"/>
    <text x="818" y="526" font-size="13.5" font-weight="700" fill="#1b2033" text-anchor="middle">④ 执行工具</text>
    <text x="818" y="550" fill="#8590ad" text-anchor="middle">读文件 · 跑命令</text>
    <text x="818" y="568" fill="#8590ad" text-anchor="middle">搜索 · 跑代码</text>

    <rect x="938" y="500" width="176" height="80" rx="10" fill="#ffffff" stroke="#bfe3d2" stroke-width="1.5"/>
    <text x="1026" y="526" font-size="13.5" font-weight="700" fill="#1b2033" text-anchor="middle">⑤ 结果写回</text>
    <text x="1026" y="550" fill="#8590ad" text-anchor="middle">原始内容 / 原始报错</text>
    <text x="1026" y="568" fill="#8590ad" text-anchor="middle">不是你的转述</text>
  </g>
  <g stroke="#4d6bfe" stroke-width="1.8" marker-end="url(#a1)">
    <line x1="282" y1="540" x2="308" y2="540"/>
    <line x1="490" y1="540" x2="516" y2="540"/>
    <line x1="698" y1="540" x2="724" y2="540"/>
    <line x1="906" y1="540" x2="932" y2="540"/>
  </g>
  <path d="M 1026 580 L 1026 606 L 194 606 L 194 586" fill="none" stroke="#4d6bfe" stroke-width="1.8"
        stroke-dasharray="7 5" marker-end="url(#a1)"/>
  <text x="610" y="600" font-size="12.5" fill="#4d6bfe" font-weight="700" text-anchor="middle">转下一圈</text>

  <text x="102" y="646" font-size="13" fill="#3d6b58">循环 · 工具协议 · 持久日志 · 闸门接口　——　这四样加起来，就是「Agent」这个词的全部内容</text>
  <text x="102" y="676" font-size="13" fill="#3d6b58">光有它，你已经能干活了。但它还是个「机制」：没有界面、不知道模型从哪来、权限怎么给也没人管。</text>

  <!-- ============ 第三排：Harness 比 Agent 机制多出来的 ============ -->
  <text x="40" y="784" font-size="14" font-weight="700" fill="#3f57d8">Harness 比「Agent 机制」多出来的五样 —— 正好是你会踩坑的地方</text>

  <g>
    <rect x="40" y="798" width="219" height="176" rx="12" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.5"/>
    <text x="58" y="828" font-size="14" font-weight="700" fill="#a5670f">① 模型适配</text>
    <line x1="58" y1="840" x2="241" y2="840" stroke="#f4dcb6"/>
    <text x="58" y="864" font-size="12.5" fill="#8a5a12">一个工具能接多家模型</text>
    <text x="58" y="888" font-size="12.5" fill="#8a5a12">换 base_url 就换模型</text>
    <text x="58" y="918" font-size="12.5" fill="#b08a4a">没有它 → 工具绑死一家</text>
    <text x="58" y="940" font-size="12.5" fill="#b08a4a">（就是「装 Claude Code</text>
    <text x="58" y="960" font-size="12.5" fill="#b08a4a">就得买 Claude」的误解）</text>

    <rect x="275" y="798" width="219" height="176" rx="12" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.5"/>
    <text x="293" y="828" font-size="14" font-weight="700" fill="#a5670f">② 上下文管理</text>
    <line x1="293" y1="840" x2="476" y2="840" stroke="#f4dcb6"/>
    <text x="293" y="864" font-size="12.5" fill="#8a5a12">什么时候压缩、丢什么</text>
    <text x="293" y="888" font-size="12.5" fill="#8a5a12">窗口满了怎么收场</text>
    <text x="293" y="918" font-size="12.5" fill="#b08a4a">没有它 → 聊到一半</text>
    <text x="293" y="940" font-size="12.5" fill="#b08a4a">突然变笨，而且是</text>
    <text x="293" y="960" font-size="12.5" fill="#b08a4a">机制决定的，救不回来</text>

    <rect x="510" y="798" width="219" height="176" rx="12" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.5"/>
    <text x="528" y="828" font-size="14" font-weight="700" fill="#a5670f">③ 沙箱与权限</text>
    <line x1="528" y1="840" x2="711" y2="840" stroke="#f4dcb6"/>
    <text x="528" y="864" font-size="12.5" fill="#8a5a12">审批粒度有多细</text>
    <text x="528" y="888" font-size="12.5" fill="#8a5a12">哪些目录根本不让碰</text>
    <text x="528" y="918" font-size="12.5" fill="#b08a4a">没有它 → 权力给太多</text>
    <text x="528" y="940" font-size="12.5" fill="#b08a4a">它敢删你的库；给太少</text>
    <text x="528" y="960" font-size="12.5" fill="#b08a4a">它又干不动活</text>

    <rect x="745" y="798" width="219" height="176" rx="12" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.5"/>
    <text x="763" y="828" font-size="14" font-weight="700" fill="#a5670f">④ 界面</text>
    <line x1="763" y1="840" x2="946" y2="840" stroke="#f4dcb6"/>
    <text x="763" y="864" font-size="12.5" fill="#8a5a12">让你看得见每一步</text>
    <text x="763" y="888" font-size="12.5" fill="#8a5a12">终端 / 网页 / 编辑器</text>
    <text x="763" y="918" font-size="12.5" fill="#b08a4a">没有它 → 看不见过程</text>
    <text x="763" y="940" font-size="12.5" fill="#b08a4a">就退回「它说完成了」</text>
    <text x="763" y="960" font-size="12.5" fill="#b08a4a">也就是回去 vibe coding</text>

    <rect x="980" y="798" width="220" height="176" rx="12" fill="#fffaf0" stroke="#f0c07a" stroke-width="1.5"/>
    <text x="998" y="828" font-size="14" font-weight="700" fill="#a5670f">⑤ 配置与插件</text>
    <line x1="998" y1="840" x2="1182" y2="840" stroke="#f4dcb6"/>
    <text x="998" y="864" font-size="12.5" fill="#8a5a12">加工具、改规矩</text>
    <text x="998" y="888" font-size="12.5" fill="#8a5a12">切模式（标准 / 极简）</text>
    <text x="998" y="918" font-size="12.5" fill="#b08a4a">有了它 → 你写的 skill</text>
    <text x="998" y="940" font-size="12.5" fill="#b08a4a">和插件才能真正改变</text>
    <text x="998" y="960" font-size="12.5" fill="#b08a4a">这个 Agent 的行为</text>
  </g>
</svg>
